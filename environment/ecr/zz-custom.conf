[www]
; -------------------------------------
; プロセス管理 (Fargate最適化)
; -------------------------------------
; static: プロセス数を固定する。
; メモリ使用量が一定になり、急なアクセス増でもコンテナが落ちにくくなる。
pm = static

; プロセス数 (子プロセスの最大数)
; 目安: メモリ1GBのタスクなら 10, 2GBなら 20〜30
; ここでは安全策をとって 10 に設定
pm.max_children = 10

; リクエスト数上限
; メモリリーク対策として、1000回処理したらプロセスを再起動してメモリを解放する
pm.max_requests = 1000

; -------------------------------------
; ヘルスチェック
; -------------------------------------
; ECSのヘルスチェック用パスを有効化
pm.status_path = /status

; -------------------------------------
; ログ設定 (CloudWatch Logs対応)
; -------------------------------------
; ワーカーの出力をキャッチしてDockerのログに流す (必須)
catch_workers_output = yes

; ログの装飾を無効化 (CloudWatchで見やすくするため)
decorate_workers_output = no

; アクセスログを無効化 (ALBやNginxで取るのでPHP側では不要。I/O削減)
; access.log = /dev/null