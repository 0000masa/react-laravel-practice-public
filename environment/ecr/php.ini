[PHP]
; -------------------------------------
; リソース制限
; -------------------------------------
; 1 プロセスあたりのメモリ上限 (画像処理やバッチ処理の余裕を見て 256M)
memory_limit = 256M

; アップロード許容サイズ (nginx の client_max_body_size と同値にそろえる)
post_max_size = 20M
upload_max_filesize = 20M

; 1 リクエストの最大実行時間 (秒)
; タイムアウト階層: ALB idle(75s) > nginx fastcgi_read(70s) > PHP max_execution_time(60s) の一番内側
max_execution_time = 60

; -------------------------------------
; エラーログ設定
; -------------------------------------
; 本番では画面にエラーを出さない
display_errors = Off
display_startup_errors = Off

; エラーを stderr に出す → コンテナの awslogs ドライバ経由で CloudWatch Logs に届く
log_errors = On
error_log = /dev/stderr

; -------------------------------------
; セキュリティ
; -------------------------------------
; レスポンスヘッダから PHP バージョンを隠す
expose_php = Off

; -------------------------------------
; 文字コード / 日本語設定
; -------------------------------------
default_charset = "UTF-8"
mbstring.language = Japanese
mbstring.internal_encoding = UTF-8

; -------------------------------------
; タイムゾーン
; -------------------------------------
; UTC に統一 (Laravel config/app.php の 'timezone' => 'UTC' と揃える)
; JST で表示したい場所はビュー層で Carbon::now('Asia/Tokyo') 等を使う
[Date]
date.timezone = "UTC"

[opcache]
; -------------------------------------
; OpCache 設定 (高速化の要)
; PHP のソースコードを一度コンパイルした結果をメモリに保持し、
; 以降のリクエストで再コンパイルを省略して高速化する仕組み。
; JIT (実行時機械語変換) は Web リクエスト中心のワークロードでは
; 効果が薄く、不安定になることもあるため本プロジェクトでは使わない。
; -------------------------------------

; OpCache を有効化する (本番では必ず 1)
opcache.enable = 1

; OpCache が使用するメモリ量 (MB)
; ここが不足すると古いエントリが追い出されキャッシュミスが増えて逆に遅くなる
opcache.memory_consumption = 128

; interned strings (重複する短い文字列: クラス名・関数名など) をまとめて持つバッファ (MB)
opcache.interned_strings_buffer = 8

; キャッシュできる PHP ファイル数の上限
; Laravel はファイルが多いので多めに設定しておく
opcache.max_accelerated_files = 10000

; 【重要】ファイルの更新時刻をチェックするかどうか (0 = チェックしない)
; 本番のコンテナイメージは不変なので、毎リクエストの stat(2) は無駄 → I/O 削減目的で 0
; 開発で「再ビルドなしにコード変更を反映」させたい場合のみ 1 にする
opcache.validate_timestamps = 0
