run-name: "ecr-deploy-laravel.yml | tag=sha-${{ github.sha }}"

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  IMAGE_TAG: sha-${{ github.sha }}
  ECR_REPO_BACKEND: react-laravel-practice-laravel-ecs

jobs:
  deploy-all:
    name: deploy-laravel-ecr
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    #  AWS 認証 (OIDC ロール)
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ECR_LARAVEL_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # ECRリポジトリのURIを取得
    - name: build and push backend image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -f ./docker/ecr/backend/Dockerfile -t $ECR_REGISTRY/${{ env.ECR_REPO_BACKEND }}:$IMAGE_TAG .
        docker push $ECR_REGISTRY/${{ env.ECR_REPO_BACKEND }}:$IMAGE_TAG
