# GitHub Actions の「実行名（run-name）」。Actions の一覧画面に表示されるタイトル。
# ${{ ... }} は GitHub が実行時に値を埋め込む式。ここでは対象 PR の番号を差し込んでいる。
run-name: "preview-create.yml | PR #${{ github.event.pull_request.number }}"

# PR ごとの検証環境を作成/更新する。
# `preview` ラベルが付いた PR の opened / synchronize(push) / reopened / labeled で発火。
# 詳細: docs/deploy/pr-preview-environment.md

# ── いつ動くか（トリガー）─────────────────────────────
# on: このワークフローを起動させるイベントを定義する。
on:
  pull_request:
    # PR が「開かれた / 新しい push が来た(synchronize) / 再オープン / ラベルが付いた」時に発火。
    # ※あくまで「起動条件」。preview ラベルの有無は後段の if: で絞り込む。
    types: [opened, synchronize, reopened, labeled]

# ── このワークフローに与える権限 ─────────────────────────
# permissions: runner に渡す GITHUB_TOKEN の権限スコープ。必要最小限に絞るのがセオリー。
permissions:
  id-token: write       # OIDC トークンの発行を許可。これで AWS に「鍵を保存せず」ログインできる（後述）。
  contents: read        # リポジトリのコードを読む権限（checkout に必要）。
  pull-requests: write  # PR にコメントを書き込む権限（最後の URL コメントに必要）。

# ── 全ジョブ共通で使う環境変数 ──────────────────────────
# env: ここで定義した値は ${ VAR } や ${{ env.VAR }} で参照できる。設定値の一元管理。
env:
  AWS_REGION: ap-northeast-1                                   # 東京リージョン
  ECR_REPO_LARAVEL: react-laravel-practice-laravel-ecs         # Laravel イメージの ECR リポジトリ名
  ECR_REPO_NGINX: react-laravel-practice-nginx-ecs             # nginx イメージの ECR リポジトリ名
  MAX_PREVIEWS: "20"                                           # 同時に存在できる検証環境の上限
  STATE_BUCKET: github-action-terraform-tf-state-bucket        # Terraform の状態ファイル(tfstate)を置く S3 バケット

# ── 実際の処理の本体 ───────────────────────────────────
# jobs: 1つ以上の「ジョブ」を定義する。ジョブはそれぞれ独立した runner（仮想マシン）で動く。
jobs:
  preview:
    # if: このジョブを実行するかどうかの条件。false なら丸ごとスキップ。
    # contains(配列, 値) は GitHub Actions の組み込み関数。
    # labels.*.name は「PR の全ラベルの name を集めた配列」を表す書き方（* はワイルドカード）。
    # → preview ラベルが付いた PR のときだけ実行する。
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest   # 実行環境。GitHub が用意する Ubuntu の最新版 runner を使う。
    environment: preview     # GitHub の「Environment(環境)」。承認ルールや環境専用の Secrets を紐づけられる。
    defaults:
      run:
        # このジョブの全 run: ステップを、デフォルトでこのディレクトリで実行する（cd を毎回書かずに済む）。
        working-directory: ./terraform/pr-env

    # ジョブ内だけで使う環境変数（トップの env に追加される形）。
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}              # PR 番号。環境を識別するキーになる。
      IMAGE_TAG: sha-${{ github.event.pull_request.head.sha }}        # PR 最新コミットの SHA を使ったイメージタグ。
                                                                      # コミットごとに一意になり、取り違えを防げる。
      TF_STATE_KEY: practice/laravel/preview/pr-${{ github.event.pull_request.number }}/terraform.tfstate
                                                                      # tfstate の保存パス。PR ごとに分けることで
                                                                      # 環境同士が干渉しないようにしている。

    # steps: 上から順に1つずつ実行される処理。uses はアクション(再利用部品)、run は任意のシェルコマンド。
    steps:
      # ── 1. PR のコードを runner に取り出す ──
      - uses: actions/checkout@v4
        with:
          # PR の HEAD（実コード）でイメージをビルドする。
          # 指定しないと「PR をマージした仮想コミット」が使われることがあるため、明示的に head.sha を指定。
          ref: ${{ github.event.pull_request.head.sha }}

      # ── 2. AWS への一時ログイン（OIDC） ──
      # アクセスキーを Secrets に保存する代わりに、GitHub が発行する一時トークンで IAM ロールを引き受ける。
      # 漏洩リスクの高い長期キーを置かなくて済むのが利点。
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_DEPLOY_ROLE_ARN }}  # 引き受ける IAM ロール（値は Secrets）
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. 同時 preview 数の上限チェック ──
      # 検証環境を作りすぎてコストやリソースが膨らむのを防ぐガード。
      - name: Enforce concurrent preview cap
        run: |
          set -euo pipefail   # エラーが出たら即停止・未定義変数をエラーに・パイプ途中の失敗も検知（安全策）
          # S3 の preview/ 配下を一覧し、"PRE pr-"（=PRごとのフォルダ）の数を数える。|| true は0件でも止めないため。
          COUNT=$(aws s3 ls "s3://${STATE_BUCKET}/practice/laravel/preview/" | grep -c "PRE pr-" || true)
          # 今回の PR の環境が「すでに存在するか」を確認（更新なら上限チェックの対象外にするため）。
          EXISTS=$(aws s3 ls "s3://${STATE_BUCKET}/practice/laravel/preview/pr-${PR_NUMBER}/" || true)
          # 新規（EXISTS が空）かつ 既存数が上限以上なら、エラーを出して終了する。
          if [ -z "$EXISTS" ] && [ "$COUNT" -ge "${MAX_PREVIEWS}" ]; then
            echo "::error::同時 preview 数が上限 (${MAX_PREVIEWS}) に達しています (現在 ${COUNT})。"
            exit 1
          fi

      # ── 4. ECR（イメージ置き場）へログイン ──
      # id: をつけると、このステップの出力を後で steps.ecr.outputs.xxx で参照できる。
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Docker イメージをビルドして ECR にプッシュ ──
      - name: Build & push images (nginx / laravel)
        working-directory: .   # ここだけリポジトリ直下で実行（Dockerfile のパスやビルド文脈の都合）
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}  # 4のログインで得た ECR のURL
        run: |
          set -euo pipefail
          # Laravel イメージをビルド → プッシュ。-f は使う Dockerfile、-t はタグ、末尾の . はビルド文脈。
          docker build -f ./docker/ecr/backend/Dockerfile -t "$ECR_REGISTRY/${ECR_REPO_LARAVEL}:${IMAGE_TAG}" .
          docker push "$ECR_REGISTRY/${ECR_REPO_LARAVEL}:${IMAGE_TAG}"
          # nginx イメージも同様にビルド → プッシュ。
          docker build -f ./docker/ecr/nginx/Dockerfile -t "$ECR_REGISTRY/${ECR_REPO_NGINX}:${IMAGE_TAG}" .
          docker push "$ECR_REGISTRY/${ECR_REPO_NGINX}:${IMAGE_TAG}"

      # ── 6. Terraform 本体のセットアップ＆実行 ──
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"   # バージョンを固定して再現性を担保

      - name: Terraform Init
        run: |
          # init: バックエンド(状態保存先のS3)やプロバイダを初期化。
          # -backend-config で接続情報を渡し、key は PR ごとに分けた tfstate のパス。
          terraform init -input=false \
            -backend-config=pr-env.tfbackend \
            -backend-config="key=${TF_STATE_KEY}"

      - name: Terraform Apply
        run: |
          # apply: 定義どおりに AWS リソースを作成/更新。-auto-approve で対話確認を省略（CI用）。
          # -var で .tf 側の変数に値を注入する（PR番号・イメージタグ・メール転送先など）。
          terraform apply -auto-approve -input=false \
            -var="pr_number=${PR_NUMBER}" \
            -var="image_tag_nginx=${IMAGE_TAG}" \
            -var="image_tag_laravel=${IMAGE_TAG}" \
            -var="mail_preview_redirect_to=${{ secrets.PREVIEW_MAIL_REDIRECT_TO }}"

      # ── 7. フロントエンド（React）のビルドと配置 ──
      # フロントを相対 /api（VITE_API_BASE_URL 未設定）でビルドし、共有バケットの pr-<n>/ へ
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # Node.js のバージョンを指定

      - name: Capture outputs
        run: |
          # terraform output -raw で出力値を取り出し、$GITHUB_ENV に書くと後続ステップの環境変数になる。
          echo "PREVIEW_URL=$(terraform output -raw preview_url)" >> "$GITHUB_ENV"

      - name: Build & upload frontend
        run: |
          set -euo pipefail
          BUCKET=$(terraform output -raw preview_frontend_bucket)   # アップロード先のS3バケット名を取得
          # preview はパスワードログイン。API は相対 /api（VITE_API_BASE_URL 未設定）。
          # npm ci は package-lock 通りにクリーンインストール（CI向けで再現性が高い）。
          (cd ../../frontend/www && npm ci && VITE_AUTH_MODE=password npm run build)
          # ビルド成果物(dist)を S3 に同期。--delete でバケット側の余分なファイルも消し、中身を一致させる。
          aws s3 sync ../../frontend/www/dist "s3://${BUCKET}/" --delete

      # ── 8. データベースの準備（作成 → migrate → seed） ──
      # DB: CREATE DATABASE → migrate → seed（PR イメージの runner タスクで）
      - name: Prepare database (create / migrate / seed)
        run: |
          set -euo pipefail
          # Terraform の出力から、ECS タスクを起動するのに必要な情報をまとめて取得。
          CLUSTER=$(terraform output -raw ecs_cluster_arn)                          # ECS クラスタ
          TASKDEF=$(terraform output -raw runner_task_definition_family)            # 実行用タスク定義
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')  # 配置するサブネット群
          SG=$(terraform output -raw ecs_security_group_id)                         # セキュリティグループ
          DB=$(terraform output -raw db_database)                                   # DB名

          # Fargate タスクのネットワーク設定。プライベートサブナット内・パブリックIPなしで起動。
          NETCFG="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}"

          # DB_DATABASE を選択せずに接続し CREATE DATABASE する PHP ワンライナー
          # （まだDBが無い段階なので、DB未指定で接続してから CREATE DATABASE IF NOT EXISTS する）
          CREATE_PHP='$h=getenv("DB_HOST");$u=getenv("DB_USERNAME");$p=getenv("DB_PASSWORD");$d=getenv("DB_DATABASE");$pdo=new PDO("mysql:host=$h",$u,$p);$pdo->exec("CREATE DATABASE IF NOT EXISTS `$d`");echo "created $d\n";'

          # 任意のコマンドを ECS タスクとして1回実行し、完了を待って終了コードを確認する関数。
          run_runner() {
            local cmd_json="$1"
            local overrides
            # コンテナに渡す command をタスク定義から上書き（containerOverrides）。jq で JSON を組み立てる。
            overrides=$(jq -nc --argjson cmd "$cmd_json" '{containerOverrides:[{name:"runner-container",command:$cmd}]}')
            local arn
            # run-task でタスクを起動し、起動した taskArn を取得。
            arn=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASKDEF" \
              --launch-type FARGATE \
              --network-configuration "$NETCFG" \
              --overrides "$overrides" \
              --query "tasks[0].taskArn" --output text)
            echo "task: $arn"
            # タスクが停止するまで待機。
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$arn"
            local code
            # コンテナの終了コードを取り出す。
            code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$arn" \
              --query "tasks[0].containers[0].exitCode" --output text)
            echo "exit code: $code"
            # 終了コードが 0（成功）なら true を返す。0以外なら set -e により後続が止まる。
            [ "$code" = "0" ]
          }

          # 上の関数を使って、DB作成 → マイグレーション → 初期データ投入の順に実行。
          run_runner "$(jq -nc --arg p "$CREATE_PHP" '["php","-r",$p]')"  # CREATE DATABASE
          run_runner '["php","artisan","migrate","--force"]'              # テーブル作成（--force=本番でも確認なしで実行）
          run_runner '["php","artisan","db:seed","--force"]'              # 初期データ投入

      # ── 9. 完成した検証環境の URL を PR にコメント ──
      # github-script は JavaScript を書いて GitHub API を直接叩けるアクション。
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;   // 7で $GITHUB_ENV に入れた URL を読む
            // PR(=issue)にコメントを作成する API 呼び出し。
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 検証環境を更新しました: ${url}\n(Basic 認証で保護されています)`,
            });
