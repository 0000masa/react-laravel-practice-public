run-name: "gcp-ar-push-nginx.yml | tag=sha-${{ github.sha }}"

# AWS 版 ecr-deploy-nginx.yml の GCP（Artifact Registry）版。
# Workload Identity Federation で長期キーなし認証し、gcloud CLI を使わず
# docker/login-action でアクセストークン認証して push する。
on:
  workflow_dispatch:

env:
  GCP_REGION: asia-northeast1
  IMAGE_TAG: sha-${{ github.sha }}
  AR_REPO: nginx

jobs:
  push:
    name: push-nginx-to-artifact-registry
    runs-on: ubuntu-latest

    permissions:
      id-token: write # WIF のトークン交換に必要
      contents: read

    steps:
      - uses: actions/checkout@v4

      # WIF でパスワードレス認証し、access_token を出力
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PUSH_NGINX_SA }}
          token_format: access_token

      # gcloud を使わず docker login（ユーザー名は固定の oauth2accesstoken）
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: build and push nginx image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/nginx:${{ env.IMAGE_TAG }}
        run: |
          docker build -f ./docker/ecr/nginx/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
